<!doctype html>

<style>
  @font-face { font-family: "Fraunces"; font-weight: 300 700; src: url("../src/fonts/fraunces.woff2") format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 300 700; src: url("../src/fonts/fraunces-italic.woff2") format("woff2"); }
  @font-face { font-family: "Albert Sans"; font-weight: 400 600; src: url("../src/fonts/albert-sans.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; src: url("../src/fonts/ibm-plex-mono-400.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f3ede3; color: #1f2a24; position: relative; overflow: hidden;
    font-family: "Albert Sans"; -webkit-font-smoothing: antialiased; }
  .brand { position: absolute; left: 80px; top: 58px; display: flex; align-items: center; gap: 12px;
    font-family: "Fraunces"; font-size: 30px; font-weight: 420; letter-spacing: -.01em; }
  .brand svg { width: 32px; height: 32px; color: #3b5748; }
  .host { position: absolute; right: 80px; top: 68px; font-family: "IBM Plex Mono"; font-size: 16px; letter-spacing: .08em; color: #58625c; }
  .eyebrow { position: absolute; left: 80px; top: 136px; font-family: "IBM Plex Mono"; font-size: 15px; letter-spacing: .09em; text-transform: uppercase; color: #58625c; }
  h1 { position: absolute; left: 76px; top: 180px; margin: 0; font-family: "Fraunces"; font-optical-sizing: auto; font-weight: 380;
    font-size: 84px; line-height: 1.02; letter-spacing: -.015em; }
  h1 em { font-style: italic; font-weight: 340; color: #9a4222; }
  .sub { position: absolute; left: 80px; top: 372px; width: 760px; font-size: 22px; line-height: 1.5; color: #4b5650; }
  .stage { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; overflow: hidden; border-top: 1px solid rgba(31,42,36,.10); }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; opacity: .9; }
  .stage::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(243,237,227,.55), rgba(243,237,227,0) 60%); }
  .stage svg { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
  .band { fill: rgba(126,170,138,.11); }
  .band-edge { stroke: rgba(31,42,36,.18); stroke-dasharray: 2 7; }
  .bloom { fill: none; stroke: rgba(96,200,150,.55); stroke-width: 8; vector-effect: non-scaling-stroke; }
  .line { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
</style></head>
